<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BookWith.tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/design-system.css">
</head>
<body>
    <div class="auth-wrapper min-vh-100 d-flex align-items-center justify-content-center bg-dark p-3">
        <div class="custom-card p-4 p-md-5 max-w-md w-100 reveal-on-scroll border-slate-700 text-white" style="background:#0f172a;">
            <div class="text-center mb-4">
                <a class="brand-badge fs-2 mb-2 d-inline-flex text-white" href="../index.html"><i class="bi bi-shield-lock-fill text-danger me-2"></i> BookWith.tech</a>
                <h1 class="h4 fw-bold mb-1 text-white">Administrator Access</h1>
                <p class="text-slate-400 fs-sm">Restricted system management console</p>
            </div>
            <form onsubmit="handleAdminLogin(event)">
                <div class="mb-3">
                    <label class="form-label-custom text-slate-200">Admin Identifier</label>
                    <input type="email" class="form-control-custom bg-slate-800 text-white border-slate-700" value="admin@bookwith.tech" required>
                </div>
                <div class="mb-4">
                    <label class="form-label-custom text-slate-200">Security Password</label>
                    <input type="password" class="form-control-custom bg-slate-800 text-white border-slate-700" value="AdminMasterKey2026!" required>
                </div>
                <button type="submit" class="btn-primary-custom w-100 mb-3" style="background:linear-gradient(135deg, #ef4444, #dc2626);">Authenticate Session</button>
                <div class="text-center">
                    <a href="../login.html" class="fs-sm text-slate-400">Return to Portal Switcher</a>
                </div>
            </form>
        </div>
    </div>
    <!-- Supabase JS SDK & Services -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/services/auth-service.js"></script>
    <script src="../js/services/user-service.js"></script>
    <script src="../js/services/provider-service.js"></script>
    <script src="../js/services/slot-service.js"></script>
    <script src="../js/services/booking-service.js"></script>
    <script src="../js/services/feedback-service.js"></script>
    <script src="../js/services/admin-service.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app-core.js"></script>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const email = inputs[0].value.trim();
            const password = inputs[1].value.trim();
            const btn = e.target.querySelector('button[type="submit"]');

            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                const result = await window.AuthService.login(email, password, 'Admin');
                if (result && result.success) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert(err.message || 'Admin authentication failed.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Authenticate Session';
            }
        }
    </script>
</body>
</html>
