<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Administrative User Editor — BookWith.tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Core Design System & Shared Layout Styles -->
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>

  <!-- SINGLE SOURCE OF TRUTH MASTER HEADER -->
  <site-header data-role="admin" data-active="users"></site-header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="custom-card p-4 p-md-5">
          <!-- Breadcrumb & Header -->
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb fs-xs mb-2">
              <li class="breadcrumb-item"><a href="dashboard.html">Admin</a></li>
              <li class="breadcrumb-item"><a href="user-list.html">Customer Registry</a></li>
              <li class="breadcrumb-item active" aria-current="page">Edit #USR-1001</li>
            </ol>
          </nav>

          <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom flex-wrap gap-2">
            <div>
              <h1 style="font-size: 1.65rem; font-weight: 800; color: #0f172a; margin: 0;">Edit Customer Record</h1>
              <p class="fs-xs text-muted mb-0">Record ID: <strong>#USR-1001</strong> • Registered Aug 14, 2024</p>
            </div>
            <button type="button" class="btn btn-sm btn-outline-custom text-danger border-danger" onclick="alert('Password reset link dispatched to user email.')">
              <i class="bi bi-key"></i> Force Reset Password
            </button>
          </div>

          <form onsubmit="handleSaveUser(event)">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label-custom">First Name</label>
                <input type="text" class="form-control-custom" value="Aarav" id="usrFirst" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Last Name</label>
                <input type="text" class="form-control-custom" value="Patel" id="usrLast" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Email Address</label>
                <input type="email" class="form-control-custom" value="aarav.patel@gmail.com" id="usrEmail" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Phone Number</label>
                <input type="tel" class="form-control-custom" value="9876543210" id="usrPhone" required>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Street Address</label>
                <input type="text" class="form-control-custom" value="742 Evergreen Terrace, Sector 5">
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">City</label>
                <input type="text" class="form-control-custom" value="Metropolis">
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Account Authorization Status</label>
                <select class="form-select-custom">
                  <option value="active" selected>Active & In Good Standing</option>
                  <option value="warned">Warned (1 Cancellation Strike)</option>
                  <option value="suspended">Suspended (Abuse or Fraud)</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Internal Administrative Audit Note</label>
                <textarea class="form-control-custom" rows="3">Verified customer with clean booking record. No disputes or fraudulent chargebacks logged.</textarea>
              </div>
            </div>

            <div class="pt-3 border-top d-flex justify-content-end gap-2">
              <a href="user-list.html" class="btn btn-outline-custom">Cancel</a>
              <button type="submit" class="btn-primary-custom" style="padding: 0.65rem 1.85rem;">
                <i class="bi bi-check2"></i> Save User Modifications
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- SINGLE SOURCE OF TRUTH MASTER FOOTER -->
  <site-footer data-role="admin"></site-footer>

  <!-- Supabase JS SDK & Services -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/provider-service.js"></script>
  <script src="../js/services/slot-service.js"></script>
  <script src="../js/services/booking-service.js"></script>
  <script src="../js/services/feedback-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/api-service.js"></script>

  <!-- Master Layout Scripts -->
  <script src="../js/site-header.js"></script>
  <script src="../js/site-footer.js"></script>

  <script>
    let targetUserId = 1;

    async function loadUserToEdit() {
      const urlParams = new URLSearchParams(window.location.search);
      targetUserId = parseInt(urlParams.get('id') || '1', 10);

      try {
        const user = await window.UserService.getUserById(targetUserId);
        if (user) {
          document.getElementById('usrFirst').value = user.firstname || '';
          document.getElementById('usrLast').value = user.lastname || '';
          document.getElementById('usrEmail').value = user.emailid || '';
          document.getElementById('usrPhone').value = user.phone || '';

          const subHead = document.querySelector('p.fs-xs.text-muted.mb-0');
          if (subHead) subHead.innerHTML = `Record ID: <strong>#USR-${user.userid}</strong> • Role: ${user.rolle}`;
        }
      } catch (e) {
        console.warn('Could not load user:', e);
      }
    }

    async function handleSaveUser(e) {
      e.preventDefault();
      const firstName = document.getElementById('usrFirst').value.trim();
      const lastName = document.getElementById('usrLast').value.trim();
      const email = document.getElementById('usrEmail').value.trim();
      const phone = document.getElementById('usrPhone').value.trim();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await window.UserService.updateUser(targetUserId, { firstName, lastName, email, phone });
        alert('Customer account modifications have been committed to master database.');
        window.location.href = 'user-list.html';
      } catch (err) {
        alert(err.message || 'Failed to update user.');
      } finally {
        submitBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', loadUserToEdit);
  </script>
</body>
</html>
