<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset Password — BookWith.tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Core Design System & Shared Layout Styles -->
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>

  <!-- SINGLE SOURCE OF TRUTH MASTER HEADER -->
  <site-header data-role="public"></site-header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="custom-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
              <i class="bi bi-key-fill"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin: 0;">Recover Account</h1>
            <p class="fs-xs text-muted mt-1">Enter your registered email to receive an instant verification reset PIN.</p>
          </div>

          <!-- Step 1: Email Request -->
          <div id="stepEmail">
            <form onsubmit="sendResetPin(event)">
              <div class="mb-4">
                <label class="form-label-custom">Registered Email Address</label>
                <input type="email" id="txtResetEmail" class="form-control-custom" placeholder="name@domain.com" required value="aarav.patel@gmail.com">
              </div>
              <button type="submit" class="btn-primary-custom w-100 py-3">
                <i class="bi bi-send"></i> Send Verification PIN
              </button>
            </form>
          </div>

          <!-- Step 2: PIN and New Password (Hidden initially) -->
          <div id="stepPin" style="display: none;">
            <div class="alert alert-success fs-xs py-2 px-3 rounded-3 mb-3">
              <i class="bi bi-check-circle-fill"></i> 6-digit PIN sent to your email (Demo PIN: <strong>482910</strong>)
            </div>
            <form onsubmit="handleFinalReset(event)">
              <div class="mb-3">
                <label class="form-label-custom">Verification PIN</label>
                <input type="text" id="txtPin" class="form-control-custom text-center letter-spacing-1 fw-bold fs-5" maxlength="6" placeholder="••••••" value="482910" required>
              </div>
              <div class="mb-4">
                <label class="form-label-custom">Set New Password</label>
                <input type="password" id="txtNewPass" class="form-control-custom" placeholder="New secure password" required>
              </div>
              <button type="submit" class="btn-primary-custom w-100 py-3">
                <i class="bi bi-check-circle"></i> Save & Sign In
              </button>
            </form>
          </div>

          <div class="text-center mt-4 pt-2 border-top">
            <a href="../login.html" class="fs-xs fw-bold text-primary text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- SINGLE SOURCE OF TRUTH MASTER FOOTER -->
  <site-footer data-role="public"></site-footer>

  <!-- Supabase JS SDK & Services -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/provider-service.js"></script>
  <script src="../js/services/slot-service.js"></script>
  <script src="../js/services/booking-service.js"></script>
  <script src="../js/services/feedback-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/api-service.js"></script>

  <!-- Master Layout Scripts -->
  <script src="../js/site-header.js"></script>
  <script src="../js/site-footer.js"></script>

  <script>
    let resetTargetEmail = '';

    function sendResetPin(e) {
      e.preventDefault();
      resetTargetEmail = document.getElementById('txtResetEmail').value.trim();
      document.getElementById('stepEmail').style.display = 'none';
      document.getElementById('stepPin').style.display = 'block';
    }

    async function handleFinalReset(e) {
      e.preventDefault();
      const newPass = document.getElementById('txtNewPass').value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await window.AuthService.forgotPassword(resetTargetEmail, newPass);
        alert('Password has been successfully updated. Please sign in with your new credentials.');
        window.location.href = '../login.html';
      } catch (err) {
        alert(err.message || 'Failed to update password.');
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
