<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Change Password — BookWith.tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Core Design System & Shared Layout Styles -->
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>

  <!-- SINGLE SOURCE OF TRUTH MASTER HEADER -->
  <site-header data-role="customer"></site-header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="custom-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--color-primary-light); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin: 0;">Change Password</h1>
            <p class="fs-xs text-muted mt-1">Ensure your account is protected with a high-entropy password.</p>
          </div>

          <form onsubmit="handlePassChange(event)">
            <div class="mb-3">
              <label class="form-label-custom">Current Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control-custom" placeholder="Enter current password" required>
            </div>

            <div class="mb-3">
              <label class="form-label-custom">New Password <span class="text-danger">*</span></label>
              <input type="password" id="newPass" class="form-control-custom" placeholder="Enter new password" required>
            </div>

            <div class="mb-4">
              <label class="form-label-custom">Confirm New Password <span class="text-danger">*</span></label>
              <input type="password" id="confirmPass" class="form-control-custom" placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="btn-primary-custom w-100 py-3">
              <i class="bi bi-check2-circle"></i> Update Password
            </button>
            <div class="text-center mt-3">
              <a href="profile.html" class="fs-xs text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Profile</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- SINGLE SOURCE OF TRUTH MASTER FOOTER -->
  <site-footer data-role="customer"></site-footer>

  <!-- Supabase JS SDK & Services -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/provider-service.js"></script>
  <script src="../js/services/slot-service.js"></script>
  <script src="../js/services/booking-service.js"></script>
  <script src="../js/services/feedback-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/api-service.js"></script>

  <!-- Master Layout Scripts -->
  <script src="../js/site-header.js"></script>
  <script src="../js/site-footer.js"></script>

  <script>
    async function handlePassChange(e) {
      e.preventDefault();
      const currentUser = window.AuthService.getCurrentUser();
      if (!currentUser) {
        alert('Please sign in first.');
        window.location.href = '../login.html';
        return;
      }

      const oldPass = e.target.querySelector('input[type="password"]').value.trim();
      const p1 = document.getElementById('newPass').value.trim();
      const p2 = document.getElementById('confirmPass').value.trim();

      if (p1 !== p2) {
        alert('New passwords do not match. Please verify.');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await window.AuthService.changePassword(currentUser.userid, oldPass, p1);
        alert('Your account password has been successfully updated.');
        window.location.href = 'profile.html';
      } catch (err) {
        alert(err.message || 'Failed to update password.');
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
