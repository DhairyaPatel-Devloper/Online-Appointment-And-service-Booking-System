<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shop Profile & Schedule Settings — BookWith.tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Core Design System & Shared Layout Styles -->
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body>

  <!-- SINGLE SOURCE OF TRUTH MASTER HEADER -->
  <site-header data-role="provider" data-active="shop-profile"></site-header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="custom-card p-4 p-md-5">
          <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom flex-wrap gap-2">
            <div>
              <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin: 0;">Shop Profile & Hours</h1>
              <p class="fs-xs text-muted mb-0">Configure your public business listing and automated booking schedule</p>
            </div>
            <span class="badge-custom badge-success"><i class="bi bi-patch-check-fill"></i> Verified Storefront</span>
          </div>

          <form onsubmit="handleSaveShopProfile(event)">
            <!-- General Business Info -->
            <h3 class="fs-6 fw-bold text-slate-900 mb-3 text-uppercase fs-xs text-muted letter-spacing-1">1. Business Profile</h3>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label-custom">Business / Salon Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control-custom" value="Aura Luxury Salon & Spa" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Primary Category <span class="text-danger">*</span></label>
                <select class="form-select-custom" required>
                  <option value="hair" selected>Hair, Styling & Beauty Spa</option>
                  <option value="skin">Dermatology & Skin Clinic</option>
                  <option value="dental">Dental & Oral Care</option>
                  <option value="wellness">Wellness & Massage</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Business Hotline <span class="text-danger">*</span></label>
                <input type="tel" class="form-control-custom" value="+1 (800) 492-2665" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Official Business Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control-custom" value="dhairya.patel@glowsalon.com" required>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Physical Storefront Address <span class="text-danger">*</span></label>
                <input type="text" class="form-control-custom" value="402 Crystal Plaza, Main Avenue, Sector 5, Metropolis" required>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Store Bio & Description</label>
                <textarea class="form-control-custom" rows="3">Aura Luxury Salon provides industry-leading hair design, precision cutting, balayage coloring, and restorative scalp therapies with private spa rooms.</textarea>
              </div>
            </div>

            <!-- Operating Hours Schedule -->
            <h3 class="fs-6 fw-bold text-slate-900 mb-3 text-uppercase fs-xs text-muted letter-spacing-1">2. Weekly Working Hours Schedule</h3>
            <div class="p-3 bg-light rounded-3 mb-4">
              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Monday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="09:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="20:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Tuesday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="09:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="20:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Wednesday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="09:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="20:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Thursday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="09:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="20:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Friday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="09:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="20:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center mb-2 pb-2 border-bottom">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-slate-800">Saturday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="10:00"></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="19:00"></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs"><input type="checkbox" class="form-check-input me-1"> Closed</label></div>
              </div>

              <div class="row g-2 align-items-center">
                <div class="col-3 col-sm-2 fw-bold fs-xs text-danger">Sunday</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="10:00" disabled></div>
                <div class="col-1 text-center fs-xs text-muted">to</div>
                <div class="col-4 col-sm-3"><input type="time" class="form-control-custom py-1 fs-xs" value="18:00" disabled></div>
                <div class="col-12 col-sm-3 mt-1 mt-sm-0"><label class="fs-xs fw-bold text-danger"><input type="checkbox" class="form-check-input me-1" checked> Closed</label></div>
              </div>
            </div>

            <!-- Amenities -->
            <h3 class="fs-6 fw-bold text-slate-900 mb-3 text-uppercase fs-xs text-muted letter-spacing-1">3. Facility Amenities</h3>
            <div class="row g-3 mb-4">
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2" checked> Free High-Speed Wi-Fi</label></div>
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2" checked> Complimentary Refreshments</label></div>
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2" checked> Valet / Free Parking</label></div>
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2" checked> Card & UPI Acceptance</label></div>
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2" checked> Wheelchair Accessible</label></div>
              <div class="col-sm-4"><label class="fs-sm"><input type="checkbox" class="form-check-input me-2"> Air Conditioned Suites</label></div>
            </div>

            <div class="pt-3 border-top d-flex justify-content-end">
              <button type="submit" class="btn-primary-custom" style="padding: 0.75rem 2rem;">
                <i class="bi bi-save2-fill"></i> Save Shop Settings
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- SINGLE SOURCE OF TRUTH MASTER FOOTER -->
  <site-footer data-role="provider"></site-footer>

  <!-- Supabase JS SDK & Services -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/user-service.js"></script>
  <script src="../js/services/provider-service.js"></script>
  <script src="../js/services/slot-service.js"></script>
  <script src="../js/services/booking-service.js"></script>
  <script src="../js/services/feedback-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/api-service.js"></script>

  <!-- Master Layout Scripts -->
  <script src="../js/site-header.js"></script>
  <script src="../js/site-footer.js"></script>

  <script>
    let activeProviderId = 1;

    async function loadShopProfile() {
      const currentUser = window.AuthService.getCurrentUser();
      if (currentUser) {
        try {
          const pDetails = await window.ProviderService.getProviderByUserId(currentUser.userid);
          if (pDetails) {
            activeProviderId = pDetails.providerid;
            const inputs = document.querySelectorAll('form input[type="text"], form input[type="tel"], form input[type="email"]');
            if (inputs.length >= 4) {
              inputs[0].value = pDetails.businessname || '';
              inputs[1].value = pDetails.businessphone || '';
              inputs[2].value = currentUser.emailid || '';
              inputs[3].value = pDetails.businessaddress || '';
            }
          }
        } catch (e) {
          console.warn('Could not load provider profile:', e);
        }
      }
    }

    async function handleSaveShopProfile(e) {
      e.preventDefault();
      const inputs = e.target.querySelectorAll('input[type="text"], input[type="tel"]');
      const businessName = inputs[0] ? inputs[0].value.trim() : 'Shop Name';
      const businessPhone = inputs[1] ? inputs[1].value.trim() : '9876543210';
      const businessAddress = inputs[2] ? inputs[2].value.trim() : 'Storefront Address';

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        await window.ProviderService.updateProviderProfile(activeProviderId, {
          businessname: businessName,
          businessphone: businessPhone,
          businessaddress: businessAddress
        });
        alert('Your shop storefront profile has been updated successfully.');
      } catch (err) {
        alert(err.message || 'Failed to update shop profile.');
      } finally {
        submitBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', loadShopProfile);
  </script>
</body>
</html>
